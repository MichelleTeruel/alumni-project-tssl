<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Tracking System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Alumni Tracking System</h1>
            <div class="tabs">
                <button class="tab-btn active" data-tab="alumni">Alumni Login</button>
                <button class="tab-btn" data-tab="admin">Admin Login</button>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Gmail or School ID</label>
                    <input type="text" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <p class="text-center mt-3">
                New alumni? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            console.error('Global error:', msg, 'at line', line);
            alert('JavaScript error: ' + msg);
            return true;
        };
    </script>
</body>
</html>
